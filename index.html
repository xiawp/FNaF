<!doctype html><html lang=ru><head><meta charset=utf-8><title>FNaF</title><meta content="width=device-width,initial-scale=1" name=viewport><style>body,html{margin:0;padding:0;background:#101216;height:100%}body{display:flex;align-items:center;justify-content:center}#canvas{width:min(100vw,177.78vh);height:auto;border:1px solid #2a2e38;image-rendering:pixelated;touch-action:none;outline:0}#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#7d8798;font:14px system-ui;background:#000;z-index:9}#boottrack{width:min(60vw,420px);height:3px;background:#1c1c1c}#bootbar{width:0;height:100%;background:#7d8798}</style></head><body><canvas height=600 id=canvas tabindex=0 width=800></canvas><div id=boot><div id=bootlabel>Загрузка архива…</div><div id=boottrack><div id=bootbar></div></div></div><script>var Module={canvas:document.getElementById("canvas"),print:function(n){console.log(n)},printErr:function(n){console.error(n)}};</script><script type="module">import Akrile from './akrile.js';const ARCHIVE_URL='./assets.akrile',ASSET_PREFIX='assets/';const boot=document.getElementById('boot'),bootbar=document.getElementById('bootbar'),bootlabel=document.getElementById('bootlabel');await Akrile.ready;const resp=await fetch(ARCHIVE_URL,{cache:'no-store'});if(!resp.ok)throw new Error(ARCHIVE_URL+': HTTP '+resp.status);const total=Number(resp.headers.get('Content-Length'))||0;const reader=resp.body.getReader(),chunks=[];let loaded=0;for(;;){const{done,value}=await reader.read();if(done)break;chunks.push(value);loaded+=value.byteLength;bootbar.style.width=(total?loaded/total*100:0)+'%';}const archive=new Uint8Array(loaded);let off=0;for(const c of chunks){archive.set(c,off);off+=c.byteLength;}const zip=await Akrile.loadAsync(archive);const names=Object.keys(zip.files),bytes=new Map();for(const name of names)bytes.set(name,await zip.file(name).async('uint8array'));const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',bmp:'image/bmp',webp:'image/webp',svg:'image/svg+xml',ico:'image/x-icon',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',mp4:'video/mp4',webm:'video/webm',json:'application/json',txt:'text/plain',xml:'application/xml',html:'text/html',css:'text/css',js:'application/javascript',wasm:'application/wasm',data:'application/octet-stream'};const mimeOf=p=>{const i=p.lastIndexOf('.');return MIME[i<0?'':p.slice(i+1).toLowerCase()]||'application/octet-stream';};const blobUrlCache=new Map();function blobUrlFor(key){let u=blobUrlCache.get(key);if(!u){u=URL.createObjectURL(new Blob([bytes.get(key)],{type:mimeOf(key)}));blobUrlCache.set(key,u);}return u;}function resolveKey(input){if(!input)return null;let path;try{const u=new URL(String(input),location.href);if(u.origin!==location.origin)return null;path=decodeURIComponent(u.pathname.replace(/^\/+/,''));}catch{return null;}const cands=[path];const i=path.indexOf('/');if(i>0)cands.push(path.slice(i+1));const j=path.lastIndexOf('/');if(j>0&&j+1<path.length)cands.push(path.slice(j+1));cands.push(ASSET_PREFIX+path);for(const c of cands)if(bytes.has(c))return c;return null;}const _fetch=window.fetch;window.fetch=function(input,init){const url=input instanceof Request?input.url:input instanceof URL?input.href:String(input);const key=resolveKey(url);if(key){const data=bytes.get(key);return Promise.resolve(new Response(data,{status:200,headers:{'Content-Type':mimeOf(key),'Content-Length':String(data.byteLength)}}));}if(url.includes(ASSET_PREFIX))console.warn('[akrile] NETWORK MISS (fetch):',url);return _fetch.call(this,input,init);};const XP=XMLHttpRequest.prototype,_open=XP.open,_send=XP.send;XP.open=function(method,url,async,user,password){this.__ak_url=String(url);this.__ak_method=String(method).toUpperCase();this.__ak_async=async!==false;return _open.apply(this,arguments);};XP.send=function(body){if(this.__ak_method!=='GET'||!this.__ak_url)return _send.call(this,body);const key=resolveKey(this.__ak_url);if(!key){if(this.__ak_url.includes(ASSET_PREFIX))console.warn('[akrile] NETWORK MISS (xhr):',this.__ak_url);return _send.call(this,body);}const data=bytes.get(key);if(this.__ak_async)Promise.resolve().then(()=>deliverXHR(this,data,key));else deliverXHR(this,data,key);};function deliverXHR(xhr,data,key){const mime=mimeOf(key),type=xhr.responseType||'';let text,response;if(type===''||type==='text'){text=new TextDecoder('utf-8').decode(data);response=text;}else if(type==='arraybuffer'){response=data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength);}else if(type==='blob'){response=new Blob([data],{type:mime});}else if(type==='json'){response=JSON.parse(new TextDecoder().decode(data));}else{response=data.buffer;}const def=(k,v)=>Object.defineProperty(xhr,k,{value:v,configurable:true});const fire=rs=>{def('readyState',rs);try{xhr.dispatchEvent(new Event('readystatechange'));}catch{}};xhr.getAllResponseHeaders=()=>'content-type: '+mime+'\r\ncontent-length: '+data.byteLength+'\r\n';xhr.getResponseHeader=n=>{const k=(n||'').toLowerCase();if(k==='content-type')return mime;if(k==='content-length')return String(data.byteLength);return null;};fire(1);fire(2);fire(3);def('status',200);def('statusText','OK');def('responseURL',xhr.__ak_url);def('response',response);if(text!==undefined)def('responseText',text);fire(4);try{xhr.dispatchEvent(new ProgressEvent('progress',{loaded:data.byteLength,total:data.byteLength}));}catch{}try{xhr.dispatchEvent(new Event('load'));}catch{}try{xhr.dispatchEvent(new Event('loadend'));}catch{}}function hookUrlProp(proto,prop){const d=Object.getOwnPropertyDescriptor(proto,prop);if(!d||!d.set||!d.get)return;Object.defineProperty(proto,prop,{configurable:true,get(){return d.get.call(this);},set(value){const key=resolveKey(value);if(!key){if(typeof value==='string'&&value.includes(ASSET_PREFIX))console.warn('[akrile] NETWORK MISS ('+proto.constructor.name+'.'+prop+'):',value);return d.set.call(this,value);}return d.set.call(this,blobUrlFor(key));}});}hookUrlProp(HTMLImageElement.prototype,'src');hookUrlProp(HTMLAudioElement.prototype,'src');hookUrlProp(HTMLVideoElement.prototype,'src');hookUrlProp(HTMLSourceElement.prototype,'src');hookUrlProp(HTMLTrackElement.prototype,'src');hookUrlProp(HTMLScriptElement.prototype,'src');hookUrlProp(HTMLEmbedElement.prototype,'src');hookUrlProp(HTMLIFrameElement.prototype,'src');hookUrlProp(HTMLLinkElement.prototype,'href');hookUrlProp(HTMLObjectElement.prototype,'data');const ATTRS={IMG:['src'],AUDIO:['src'],VIDEO:['src','poster'],SOURCE:['src'],TRACK:['src'],SCRIPT:['src'],LINK:['href'],EMBED:['src'],OBJECT:['data'],IFRAME:['src']};function fixAttrs(el){if(!el||el.nodeType!==1)return;const attrs=ATTRS[el.tagName];if(!attrs)return;for(const a of attrs){const v=el.getAttribute(a);if(!v||v.startsWith('blob:')||v.startsWith('data:'))continue;const key=resolveKey(v);if(key)el.setAttribute(a,blobUrlFor(key));}}const mo=new MutationObserver(muts=>{for(const m of muts){if(m.type==='attributes')fixAttrs(m.target);else for(const n of m.addedNodes){fixAttrs(n);if(n.querySelectorAll)n.querySelectorAll(Object.keys(ATTRS).join(',')).forEach(fixAttrs);}}});mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','href','data','poster']});bootlabel.textContent='Архив готов: '+names.length+' файлов';setTimeout(()=>boot.remove(),500);const s=document.createElement('script');s.src='FNaF.js';s.async=false;document.body.appendChild(s);</script></body></html>
